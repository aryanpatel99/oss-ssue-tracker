# CNCF, ASWF & YC Open Source Startup Issue Tracker Configuration

settings:
  days_back: 7                  # Default look back window fallback
  cncf_days_back: 14            # Keep CNCF issues for 2 weeks
  aswf_days_back: 14            # Keep ASWF issues for 2 weeks
  lfx_days_back: 30             # Keep LFX mentorship issues for 30 days
  gsoc_days_back: 14            # Keep GSoC issues for 2 weeks
  startup_days_back: 7          # Keep startup issues for 1 week
  min_comments: 1               # Active discussion threshold (minimum 1 comment)
  max_comments: 6               # Keep upper bound so issue is not already overrun
  require_unassigned: true      # Exclude issues that are already claimed
  require_no_linked_prs: true   # Exclude issues where someone has opened a PR
  github_search_batch_size: 5   # Repos per GitHub search query
  foundations:                  # Foundations to query via Clotributor
    - id: "cncf"
      name: "CNCF"
    - id: "aswf"
      name: "ASWF"

target_labels:
  - "good first issue"
  - "good-first-issue"
  - "help wanted"
  - "help-wanted"
  - "lfx-mentorship"
  - "lfx"
  - "mentorship"
  - "easy"
  - "beginner"
  - "difficulty/easy"
  - "up-for-grabs"
  - "bug"
  - "enhancement"
  - "documentation"

