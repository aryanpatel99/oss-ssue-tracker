# CNCF Issue Tracker Configuration

settings:
  default_hours: 28
  max_issues_per_project: 5
  github_search_batch_size: 6

target_labels:
  - "good first issue"
  - "good-first-issue"
  - "help wanted"
  - "help-wanted"
  - "lfx-mentorship"
  - "lfx"
  - "mentorship"
  - "easy"
  - "beginner"
  - "difficulty/easy"
  - "difficulty/starter"
  - "up-for-grabs"
  - "documentation"

categories:
  - name: "Kubernetes & Core"
    projects:
      - repo: "kubernetes/kubernetes"
        language: "Go"
      - repo: "kubernetes/minikube"
        language: "Go"
      - repo: "kubernetes-sigs/kind"
        language: "Go"
      - repo: "kubernetes-sigs/kustomize"
        language: "Go"
      - repo: "kubernetes-sigs/cluster-api"
        language: "Go"
      - repo: "containerd/containerd"
        language: "Go"
      - repo: "etcd-io/etcd"
        language: "Go"
      - repo: "cri-o/cri-o"
        language: "Go"

  - name: "Observability"
    projects:
      - repo: "prometheus/prometheus"
        language: "Go"
      - repo: "open-telemetry/opentelemetry-collector"
        language: "Go"
      - repo: "open-telemetry/opentelemetry-go"
        language: "Go"
      - repo: "open-telemetry/opentelemetry-rust"
        language: "Rust"
      - repo: "open-telemetry/opentelemetry-python"
        language: "Python"
      - repo: "jaegertracing/jaeger"
        language: "Go"
      - repo: "fluent/fluent-bit"
        language: "C"

  - name: "Networking & Service Mesh"
    projects:
      - repo: "cilium/cilium"
        language: "Go"
      - repo: "envoyproxy/envoy"
        language: "C++"
      - repo: "linkerd/linkerd2"
        language: "Go"
      - repo: "linkerd/linkerd2-proxy"
        language: "Rust"
      - repo: "coredns/coredns"
        language: "Go"

  - name: "GitOps & Delivery"
    projects:
      - repo: "argoproj/argo-cd"
        language: "Go"
      - repo: "argoproj/argo-workflows"
        language: "Go"
      - repo: "fluxcd/flux2"
        language: "Go"
      - repo: "helm/helm"
        language: "Go"
      - repo: "crossplane/crossplane"
        language: "Go"

  - name: "Security & Policy"
    projects:
      - repo: "kyverno/kyverno"
        language: "Go"
      - repo: "falcosecurity/falco"
        language: "C++"
      - repo: "cert-manager/cert-manager"
        language: "Go"
      - repo: "open-policy-agent/opa"
        language: "Go"
      - repo: "in-toto/in-toto"
        language: "Python"

  - name: "Storage & Data"
    projects:
      - repo: "tikv/tikv"
        language: "Rust"
      - repo: "vitessio/vitess"
        language: "Go"
      - repo: "rook/rook"
        language: "Go"

  - name: "Frameworks & Developer Tools"
    projects:
      - repo: "dapr/dapr"
        language: "Go"
      - repo: "kedacore/keda"
        language: "Go"
      - repo: "litmuschaos/litmus"
        language: "Go"
      - repo: "meshery/meshery"
        language: "Go"

  - name: "Mentorship Hub"
    projects:
      - repo: "cncf/mentoring"
        language: "Markdown"
