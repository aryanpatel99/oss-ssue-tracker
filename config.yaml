# CNCF Issue Tracker Configuration
# Curated projects & organizations participating in CNCF & LFX Mentorship

settings:
  default_hours: 28         # Overlap slightly past 24h to avoid missing issues
  max_issues_per_project: 5 # Cap per project to maintain balanced digest
  github_search_batch_size: 6 # Repos per GitHub search query to avoid query length limits

# Labels indicating newcomer-friendly or mentorship opportunities
target_labels:
  - "good first issue"
  - "good-first-issue"
  - "help wanted"
  - "help-wanted"
  - "lfx-mentorship"
  - "lfx"
  - "mentorship"
  - "easy"
  - "beginner"
  - "difficulty/easy"
  - "difficulty/starter"
  - "up-for-grabs"
  - "documentation"

# Curated CNCF projects grouped by category & primary language
categories:
